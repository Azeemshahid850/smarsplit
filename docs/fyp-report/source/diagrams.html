<div id="root"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const INK = '#1f2937', SOFT = '#4b5563', TINT = '#eef2f7', ACC = '#0f5132', ACCT = '#e7f3ec';

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function figure(id, w, h) {
  const d = document.createElement('div'); d.className = 'fig'; d.id = id;
  document.getElementById('root').appendChild(d);
  const s = el('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}` });
  d.appendChild(s);
  const defs = el('defs', {}, s);
  const m = el('marker', { id: `a-${id}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0 0L10 5L0 10z', fill: INK }, m);
  const t = el('marker', { id: `t-${id}`, viewBox: '0 0 12 12', refX: 11, refY: 6, markerWidth: 12, markerHeight: 12, orient: 'auto' }, defs);
  el('path', { d: 'M0 0L12 6L0 12z', fill: '#fff', stroke: INK, 'stroke-width': 1 }, t);
  s.arrow = `url(#a-${id})`; s.tri = `url(#t-${id})`;
  return s;
}
function text(s, x, y, str, o = {}) {
  const t = el('text', { x, y, 'font-size': o.size || 13, 'text-anchor': o.anchor || 'middle', 'font-weight': o.bold ? 700 : 400, 'font-style': o.italic ? 'italic' : 'normal', fill: o.fill || INK }, s);
  t.textContent = str; return t;
}
function lines(s, x, y, arr, o = {}) {
  const lh = o.lh || 16; arr.forEach((str, i) => text(s, x, y + i * lh, str, o));
}
function box(s, x, y, w, h, arr, o = {}) {
  el('rect', { x, y, width: w, height: h, rx: o.rx ?? 6, fill: o.fill || '#fff', stroke: o.stroke || INK, 'stroke-width': o.sw || 1.2, 'stroke-dasharray': o.dash || '' }, s);
  const lh = o.lh || 16, n = arr.length;
  const y0 = y + h / 2 - ((n - 1) * lh) / 2 + 4.5;
  arr.forEach((str, i) => text(s, x + w / 2, y0 + i * lh, str, { size: o.size || 13, bold: o.bold && i === 0 }));
}
function line(s, pts, o = {}) {
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join('');
  el('path', { d, fill: 'none', stroke: o.stroke || INK, 'stroke-width': o.sw || 1.2, 'stroke-dasharray': o.dash || '', 'marker-end': o.end === false ? '' : (o.tri ? s.tri : s.arrow), 'marker-start': o.both ? s.arrow : '' }, s);
}
function band(s, x, y, w, h, title) {
  el('rect', { x, y, width: w, height: h, rx: 10, fill: TINT, stroke: '#9aa5b4', 'stroke-width': 1 }, s);
  text(s, x + 14, y + 22, title, { anchor: 'start', bold: true, size: 14 });
}
function actor(s, x, y, label) {
  el('circle', { cx: x, cy: y - 34, r: 10, fill: '#fff', stroke: INK, 'stroke-width': 1.3 }, s);
  line(s, [[x, y - 24], [x, y]], { end: false }); line(s, [[x - 16, y - 14], [x + 16, y - 14]], { end: false });
  line(s, [[x, y], [x - 13, y + 20]], { end: false }); line(s, [[x, y], [x + 13, y + 20]], { end: false });
  lines(s, x, y + 38, Array.isArray(label) ? label : [label], { size: 13, bold: true });
}
function usecase(s, cx, cy, label, w = 250, h = 36) {
  el('ellipse', { cx, cy, rx: w / 2, ry: h / 2, fill: '#fff', stroke: INK, 'stroke-width': 1.2 }, s);
  text(s, cx, cy + 4.5, label, { size: 12.5 });
}
function diamond(s, cx, cy, w, h, arr) {
  el('polygon', { points: `${cx},${cy - h / 2} ${cx + w / 2},${cy} ${cx},${cy + h / 2} ${cx - w / 2},${cy}`, fill: '#fff', stroke: INK, 'stroke-width': 1.2 }, s);
  lines(s, cx, cy + 4.5 - ((arr.length - 1) * 15) / 2, arr, { size: 12.5, lh: 15 });
}
function terminal(s, cx, cy, w, label) {
  el('rect', { x: cx - w / 2, y: cy - 18, width: w, height: 36, rx: 18, fill: ACCT, stroke: ACC, 'stroke-width': 1.4 }, s);
  text(s, cx, cy + 4.5, label, { bold: true });
}

/* ---------- Sequence helper ---------- */
function sequence(id, w, parts, msgs, rowH = 36, top = 70) {
  const h = top + msgs.length * rowH + 40;
  const s = figure(id, w, h);
  parts.forEach(([x, l]) => {
    box(s, x - 62, 10, 124, 40, l, { bold: true, size: 12, lh: 14, fill: ACCT, stroke: ACC });
    line(s, [[x, 50], [x, h - 10]], { end: false, dash: '4 4', stroke: '#9aa5b4' });
  });
  msgs.forEach((m, i) => {
    const y = top + i * rowH + 16;
    const [from, to, label, o = {}] = m;
    const x1 = parts[from][0], x2 = parts[to][0];
    if (from === to) {
      line(s, [[x1, y - 8], [x1 + 40, y - 8], [x1 + 40, y + 6], [x1 + 4, y + 6]], { dash: o.dash || '' });
      text(s, x1 + 48, y + 2, label, { anchor: 'start', size: 11.5 });
    } else {
      line(s, [[x1, y], [x2 + (x2 > x1 ? -2 : 2), y]], { dash: o.reply ? '5 4' : '' });
      text(s, (x1 + x2) / 2, y - 6, label, { size: 11.5, fill: o.reply ? SOFT : INK });
    }
    text(s, 12, y + 4, String(i + 1), { anchor: 'start', size: 11, fill: SOFT, bold: true });
    if (o.note) {
      el('rect', { x: o.note[0], y: y - 13, width: o.note[1], height: 22, rx: 3, fill: '#fff8e6', stroke: '#c9a227' }, s);
      text(s, o.note[0] + o.note[1] / 2, y + 2, o.note[2], { size: 11, italic: true });
    }
  });
  return s;
}
